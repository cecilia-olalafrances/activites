<style>
/* Layout: activity hub — header with logo, tab bar of 6 activities, one activity panel at a time, cards in a responsive grid. Tokens = charte Olala francés */
:root{
  --surface:#fbfaf7; --raised:#ffffff; --line:#e6e3dd; --ink:#1b2340; --muted:#5b6075;
  --bordeaux:#9b2335; --on-bordeaux:#ffffff; --bordeaux-soft:#f6e4e6;
  --dijon:#d9a441; --dijon-ink:#8a5f0e; --dijon-soft:#f8eccf; --olive:#4f6b3a; --olive-soft:#e6eddc;
  --f-serif:Lora, Georgia, serif; --f-sans:Poppins, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --surface:#14161f; --raised:#1e2130; --line:#2f3346; --ink:#eef0f6; --muted:#a9aec2;
  --bordeaux:#e8798a; --on-bordeaux:#14161f; --bordeaux-soft:#3a1f26; --dijon:#e8b85a; --dijon-ink:#e8b85a; --dijon-soft:#3a3020;
  --olive:#9dbb7e; --olive-soft:#26301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --surface:#14161f; --raised:#1e2130; --line:#2f3346; --ink:#eef0f6; --muted:#a9aec2;
  --bordeaux:#e8798a; --on-bordeaux:#14161f; --bordeaux-soft:#3a1f26; --dijon:#e8b85a; --dijon-ink:#e8b85a; --dijon-soft:#3a3020;
  --olive:#9dbb7e; --olive-soft:#26301f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--surface);color:var(--ink);font-family:var(--f-sans);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--raised)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--bordeaux);outline-offset:2px;border-radius:4px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1000px;margin:0 auto}
header{background:var(--raised);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.lg{height:42px;width:auto}.lg-d{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-l{display:none}:root:not([data-theme="light"]) .lg-d{display:inline}}
:root[data-theme="dark"] .lg-l{display:none}:root[data-theme="dark"] .lg-d{display:inline}
.level{margin-left:auto;font-size:.72rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.hero{padding-block:28px 8px}
h1{font-family:var(--f-serif);font-weight:600;font-size:clamp(1.8rem,4.5vw,2.6rem);line-height:1.15;margin:0;text-wrap:balance}
.lead{color:var(--muted);margin:8px 0 0;font-family:var(--f-serif);font-style:italic}
.tabs{display:flex;gap:6px 22px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:22px 0 22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 2px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--bordeaux);border-color:var(--bordeaux)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.consigne{flex:1;min-width:240px;font-family:var(--f-serif);font-style:italic;margin:0}
.consigne small{display:block;font-family:var(--f-sans);font-style:normal;color:var(--muted);font-size:.85rem}
.btn{border:1px solid var(--bordeaux);background:var(--bordeaux);color:var(--on-bordeaux);border-radius:8px;padding:8px 16px;font-weight:500;font-size:.92rem}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:14px 10px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px;justify-content:center}
button.card:hover{border-color:var(--muted)}
.pic{font-size:3.2rem;line-height:1.1}.pic svg{width:1.25em;height:1.25em;display:block;margin:-.1em auto}
.theme{display:inline-flex;align-items:center;gap:10px;margin-top:16px;font-size:.9rem;font-weight:500}
.theme select{font:inherit;font-weight:400;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--ink)}
.word{font-weight:500;font-size:1rem}
.es{font-size:.82rem;color:var(--dijon-ink);font-style:italic}
.hidden-word{color:var(--muted);font-size:.85rem}
.card.ok{border-color:var(--olive);background:var(--olive-soft)}
.card.ko{border-color:var(--bordeaux);background:var(--bordeaux-soft)}
.card.sel{border-color:var(--dijon);box-shadow:0 0 0 2px var(--dijon)}
.card.done{opacity:.55}
/* memory */
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.mem button{aspect-ratio:1/1;max-width:100%;border-radius:8px;border:1px solid var(--line);background:var(--bordeaux);color:var(--on-bordeaux);display:grid;place-items:center;padding:6px;font-weight:500;font-size:.92rem}
.mem button.up{background:var(--raised);color:var(--ink)}
.mem button.found{background:var(--olive-soft);border-color:var(--olive);color:var(--ink)}
.mem .pic{font-size:2.6rem}
.back svg{width:38px;height:38px;opacity:.9}
/* quiz */
.quiz{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:18px;max-width:560px;margin:0 auto}
.quiz .pic{font-size:5rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;font-weight:500}
.opts button.ok{background:var(--olive-soft);border-color:var(--olive)}
.opts button.ko{background:var(--bordeaux-soft);border-color:var(--bordeaux)}
.progress{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.feedback{min-height:1.6em;font-family:var(--f-serif);font-style:italic;font-size:1.1rem}
.feedback.ok{color:var(--olive)}.feedback.ko{color:var(--bordeaux)}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.col{display:flex;flex-direction:column;gap:8px}
.col button{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:10px 12px;font-weight:500;display:flex;align-items:center;gap:12px;min-height:56px;text-align:left}
.col button .pic{font-size:1.9rem}
.col button.sel{border-color:var(--dijon);box-shadow:0 0 0 2px var(--dijon)}
.col button.ok{background:var(--olive-soft);border-color:var(--olive);opacity:.7}
.col button.ko{background:var(--bordeaux-soft);border-color:var(--bordeaux)}
.end{background:var(--olive-soft);border-radius:10px;padding:16px 20px;margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.end p{margin:0;font-family:var(--f-serif);font-style:italic;font-size:1.1rem;color:var(--olive);flex:1}
.speak{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;color:var(--bordeaux)}
.speak.big{width:64px;height:64px}
footer{margin-top:48px;padding-block:20px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted)}
footer .in{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:560px){.match{gap:10px}.col button{padding:8px;gap:8px;font-size:.9rem}.opts{grid-template-columns:1fr}.lg{height:34px}}
.card .pic svg{width:100px;height:100px;margin:0 auto}.mem .pic svg{width:78px;height:78px}.quiz .pic.big svg{width:170px;height:170px}.opts .pic.mid svg{width:92px;height:92px;margin:0 auto}.col .pic svg{width:52px;height:52px}.opts button{display:grid;place-items:center}
</style>
</head>

/* features present in each picture (to avoid ambiguous choices) */
function feats(v){if(v.b)return [v.id].concat(v.f||[]);var p=v.p,f=[v.id],hs=p.hs||"court",hc=p.hc||"brun";
  if(hs!=="chauve"&&hs!=="vieux")f.push({blond:"blond",brun:"brun",chatain:"chatain",roux:"roux"}[hc]);
  ({court:["courts"],long:["longs"],raides:["longs","raides"],frises:["frises","courts"],frange:["frange","courts"],queue:["queue","longs"],tresses:["tresses","longs"],chauve:["chauve","degarni"],degarni:["degarni","chauve"],vieux:["courts","age"]}[hs]||[]).forEach(function(x){f.push(x)});
  if(p.barbe)f.push("barbu","barbe");if(p.moustache)f.push("moustachu","moustache");if(p.rase)f.push("rase");
  if(p.skin)f.push(p.skin);if(p.age==="jeune")f.push("jeune");if(p.makeup)f.push("maquille");if(p.nez)f.push("nez");if(p.mouth)f.push("bouche");
  if(p.eyes)f.push(p.eyes);if(p.shape)f.push({rond:"vrond",carre:"vcarre",allonge:"vallonge"}[p.shape]);
  ["taches","grain","rides","cernes","boutons"].forEach(function(k){if(p[k])f.push(k)});
  if(p.tattoo)f.push("tatouage");if(p.earrings)f.push("boucles");if(p.piercing)f.push("piercing");if(p.glasses)f.push("lunettes");if(p.barrette)f.push("barrette");if(p.bandeau)f.push("bandeau");
  if(v.id==="age")f.push("rides");if(v.id==="rides")f.push("age");if(v.id==="jeune"||v.id==="age")f.push("jeune","age");
  if(v.id==="rase"||v.id==="barbu"||v.id==="barbe"||v.id==="moustachu"||v.id==="moustache")f.push("rase");
  return f}
V.forEach(function(v){v.F=feats(v)});
function conflict(a,b){return a.F.indexOf(b.id)>=0||b.F.indexOf(a.id)>=0}
var CACHE={};
function P(v){if(!CACHE[v.id])CACHE[v.id]='<svg viewBox="'+(v.b||v.p.tank?"0 0 100 100":v.p.rase?"0 24 100 58":"19 11 62 66")+'" aria-hidden="true">'+(v.b?body(v.b):v.p.rase?rase():face(v.p))+'</svg>';return CACHE[v.id]}
var CATS=[["tous","Tout le vocabulaire"],["silhouette","La taille et la silhouette"],["cheveux","Les cheveux et les poils"],["visage","Le visage"],["accessoires","Les accessoires"]];var cat="tous";
function POOL(){return cat==="tous"?V:V.filter(function(v){return v.c===cat})}
var TABS=[["imagier","Imagier"],["devine","Images sans légende"],["memory","Memory"],["legende","La bonne légende"],["associer","Associer"],["ecoute","Écoute et trouve"]];
var showEs=false,cur="imagier";
var $=function(s){return document.querySelector(s)};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a};
function pickSet(n){var out=[];shuffle(POOL()).forEach(function(v){if(out.length<n&&out.every(function(o){return !conflict(o,v)}))out.push(v)});return out}
function opts(v){return shuffle([v].concat(shuffle(POOL().filter(function(x){return x!==v&&!conflict(x,v)})).slice(0,3)))}
var spk='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
var voice=null;function loadVoice(){try{var vs=speechSynthesis.getVoices();voice=vs.find(function(v){return /^fr(-|_)FR/i.test(v.lang)})||vs.find(function(v){return /^fr/i.test(v.lang)})||null}catch(e){}}
try{loadVoice();speechSynthesis.onvoiceschanged=loadVoice}catch(e){}
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voice)u.voice=voice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
var idx=function(v){return V.indexOf(v)};
function tabs(){$("#tabs").innerHTML=TABS.map(function(t){return '<button role="tab" aria-selected="'+(t[0]===cur)+'" data-tab="'+t[0]+'">'+t[1]+'</button>'}).join("")}
function tools(c,es,extra){return '<div class="tools"><p class="consigne">'+c+'<small>'+es+'</small></p>'+(extra||"")+'</div>'}
var esToggle=function(){return '<label class="toggle"><input type="checkbox" id="esT" '+(showEs?"checked":"")+'> Afficher l’espagnol</label>'};
var again='<button class="btn ghost" data-again>Recommencer</button>';
function endBox(m){return '<div class="end"><p>'+m+'</p><button class="btn" data-again>Rejouer</button></div>'}
var BACK='<span class="back"><svg viewBox="0 0 24 40" aria-hidden="true"><path d="M5.5 8.5 A9 9 0 0 1 18.5 8.5" fill="none" stroke="#d9a441" stroke-width="2.2" stroke-linecap="round"/><path d="M8.3 11.6 A5 5 0 0 1 15.7 11.6" fill="none" stroke="#d9a441" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="16" r="3.2" fill="#fff"/><path d="M10.8 22 h2.4 l2 17 h-6.4z" fill="#fff"/></svg></span>';
var M,Q,A,E;
var R={
 imagier:function(){return tools("Regarde, écoute et répète.","Miren, escuchen y repitan.",esToggle())+'<div class="grid">'+POOL().map(function(v){return '<div class="card"><span class="pic">'+P(v)+'</span><span class="word">'+v.w+'</span>'+(showEs?'<span class="es">'+v.es+'</span>':'')+'<button class="speak" data-say="'+idx(v)+'" aria-label="Écouter '+v.w+'">'+spk+'</button></div>'}).join("")+'</div>'},
 devine:function(){return tools("Dis le mot à voix haute, puis clique pour vérifier.","Digan la palabra en voz alta y hagan clic para comprobar.",again)+'<div class="grid">'+shuffle(POOL()).map(function(v){return '<button class="card" data-reveal="'+idx(v)+'"><span class="pic">'+P(v)+'</span><span class="hidden-word">Clique pour voir</span></button>'}).join("")+'</div>'},
 memory:function(){var set=pickSet(8);var cards=shuffle(set.map(function(v){return{k:idx(v),t:"p"}}).concat(set.map(function(v){return{k:idx(v),t:"w"}})));M={cards:cards,open:[],found:0,tries:0};
   return tools("Retrouve les paires : une image et son mot.","Encuentren los pares: una imagen y su palabra.",again)+'<div class="mem">'+cards.map(function(c,i){return '<button data-mem="'+i+'" aria-label="Carte '+(i+1)+'">'+BACK+'</button>'}).join("")+'</div><div id="memEnd"></div>'},
 legende:function(){Q={list:shuffle(POOL()).slice(0,10),i:0,score:0};return tools("Choisis le bon mot pour l’image.","Elijan la palabra correcta para la imagen.")+'<div id="quiz"></div>'},
 associer:function(){var set=pickSet(6);A={sel:null,done:0,n:set.length};
   return tools("Clique sur une image, puis sur son mot.","Hagan clic en una imagen y luego en su palabra.",again)+'<div class="match"><div class="col">'+shuffle(set).map(function(v){return '<button data-a-pic="'+idx(v)+'"><span class="pic">'+P(v)+'</span><span class="hidden-word"></span></button>'}).join("")+'</div><div class="col">'+shuffle(set).map(function(v){return '<button data-a-word="'+idx(v)+'">'+v.w+'</button>'}).join("")+'</div></div><div id="aEnd"></div>'},
 ecoute:function(){E={list:shuffle(POOL()).slice(0,8),i:0,score:0};return tools("Écoute et clique sur la bonne image.","Escuchen y hagan clic en la imagen correcta.")+'<div id="ecq"></div>'}
};
function quiz(){var box=$("#quiz");if(Q.i>=Q.list.length){box.innerHTML=endBox("Score : "+Q.score+" / "+Q.list.length+". "+(Q.score>=Q.list.length*.8?"Excellent travail.":"Continue, tu progresses."));return}
  var v=Q.list[Q.i];box.innerHTML='<div class="quiz"><span class="progress">'+(Q.i+1)+' / '+Q.list.length+'</span><span class="pic big">'+P(v)+'</span><div class="opts">'+opts(v).map(function(x){return '<button data-q="'+idx(x)+'">'+x.w+'</button>'}).join("")+'</div><div class="feedback" id="fb"></div></div>';Q.first=true}
function ecq(){var box=$("#ecq");if(E.i>=E.list.length){box.innerHTML=endBox("Score : "+E.score+" / "+E.list.length+". "+(E.score>=E.list.length*.75?"Très bonne oreille.":"Écoute encore, tu progresses."));return}
  var v=E.list[E.i],k=idx(v);box.innerHTML='<div class="quiz"><span class="progress">'+(E.i+1)+' / '+E.list.length+'</span><button class="speak big" data-say="'+k+'" aria-label="Écouter">'+spk.replace(/18/g,"30")+'</button><div class="opts">'+opts(v).map(function(x,n){return '<button data-e="'+idx(x)+'" aria-label="Image '+(n+1)+'"><span class="pic mid">'+P(x)+'</span></button>'}).join("")+'</div><div class="feedback" id="fb"></div></div>';E.first=true;setTimeout(function(){say(v.s)},300)}
function catSel(){$("#catSel").innerHTML=CATS.map(function(c){return '<option value="'+c[0]+'"'+(c[0]===cat?' selected':'')+'>'+c[1]+'</option>'}).join("")}
function render(){tabs();catSel();$("#panel").innerHTML=R[cur]();if(cur==="legende")quiz();if(cur==="ecoute")ecq()}
document.addEventListener("change",function(e){if(e.target.id==="esT"){showEs=e.target.checked;render()}if(e.target.id==="catSel"){cat=e.target.value;render()}});
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.tab){cur=d.tab;render();return}
  if(d.again!==undefined){render();return}
  if(d.say!==undefined){say(V[+d.say].s);return}
  if(d.reveal!==undefined){var v=V[+d.reveal];b.querySelector(".hidden-word").outerHTML='<span class="word">'+v.w+'</span><span class="es">'+v.es+'</span>';say(v.s);b.removeAttribute("data-reveal");return}
  if(d.mem!==undefined){var i=+d.mem,c=M.cards[i];if(b.classList.contains("up")||b.classList.contains("found")||M.open.length===2)return;
    b.classList.add("up");b.innerHTML=c.t==="p"?'<span class="pic">'+P(V[c.k])+'</span>':V[c.k].w;if(c.t==="w")say(V[c.k].s);M.open.push(i);
    if(M.open.length===2){M.tries++;var a=M.cards[M.open[0]],z=M.cards[M.open[1]];var bs=M.open.map(function(x){return document.querySelector('[data-mem="'+x+'"]')});
      if(a.k===z.k&&a.t!==z.t){bs.forEach(function(x){x.classList.remove("up");x.classList.add("found")});M.open=[];M.found++;if(M.found===M.cards.length/2)$("#memEnd").innerHTML=endBox("Bravo ! Toutes les paires en "+M.tries+" essais.")}
      else setTimeout(function(){bs.forEach(function(x){x.classList.remove("up");x.innerHTML=BACK});M.open=[]},1200)}return}
  if(d.q!==undefined){var v1=Q.list[Q.i];if(V[+d.q]===v1){b.classList.add("ok");$("#fb").className="feedback ok";$("#fb").textContent="Bravo !";say(v1.s);if(Q.first)Q.score++;document.querySelectorAll("[data-q]").forEach(function(x){x.disabled=true});setTimeout(function(){Q.i++;quiz()},1300)}
    else{b.classList.add("ko");b.disabled=true;Q.first=false;$("#fb").className="feedback ko";$("#fb").textContent="Essaie encore."}return}
  if(d.e!==undefined){var v2=E.list[E.i];if(V[+d.e]===v2){b.classList.add("ok");$("#fb").className="feedback ok";$("#fb").textContent="Bravo ! C’est « "+v2.w+" ».";if(E.first)E.score++;document.querySelectorAll("[data-e]").forEach(function(x){x.disabled=true});setTimeout(function(){E.i++;ecq()},1600)}
    else{b.classList.add("ko");b.disabled=true;E.first=false;$("#fb").className="feedback ko";$("#fb").textContent="Essaie encore. Réécoute le mot."}return}
  if(d.aPic!==undefined){if(b.classList.contains("ok"))return;document.querySelectorAll("[data-a-pic]").forEach(function(x){x.classList.remove("sel")});b.classList.add("sel");A.sel=+d.aPic;return}
  if(d.aWord!==undefined){if(b.classList.contains("ok")||A.sel===null)return;var p=document.querySelector('[data-a-pic="'+A.sel+'"]');
    if(+d.aWord===A.sel){b.classList.add("ok");p.classList.remove("sel");p.classList.add("ok");p.querySelector(".hidden-word").textContent=V[A.sel].w;say(V[A.sel].s);A.sel=null;A.done++;if(A.done===A.n)$("#aEnd").innerHTML=endBox("Bravo ! Tout est associé.")}
    else{b.classList.add("ko");setTimeout(function(){b.classList.remove("ko")},700)}return}
});
render();
